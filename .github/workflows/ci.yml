name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional tap test file selector'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x, 25.x]
        platform:
        - os: ubuntu-latest
          shell: bash
        - os: macos-latest
          shell: bash
        - os: windows-latest
          shell: bash
        - os: windows-latest
          shell: powershell
      fail-fast: false

    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: ${{ matrix.platform.shell }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Use Nodejs ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm test -- -c -t0 ${{ inputs.test-filter }}

      - name: Test summary (plain text)
        run: npx tap replay --no-color

      - name: Pack
        if: matrix.platform.os == 'ubuntu-latest' && matrix.platform.shell == 'bash' && matrix.node-version == '24.x'
        run: npm pack

      - name: Upload tarball
        if: matrix.platform.os == 'ubuntu-latest' && matrix.platform.shell == 'bash' && matrix.node-version == '24.x'
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: brace-expansion-*.tgz
          if-no-files-found: error
